<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Havelock — Internal Ops Console</title>
  <!-- Inline so the browser never requests a favicon file (and never 404s for one). -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232f5bd0'/></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar__inner">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true"></span>
        <span class="brand__name">Havelock</span>
        <span class="brand__sep">/</span>
        <span class="brand__sub">Internal Ops Console</span>
      </div>
      <div class="env" id="env-status">
        <span class="env__dot" id="env-dot"></span>
        <span id="env-text">checking n8n…</span>
      </div>
    </div>
  </header>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Automation"></nav>

  <main class="layout">

    <!-- ---------------------------------------------------------------- -->
    <section class="panel panel--trigger" id="submit-panel" aria-labelledby="trigger-heading">
      <div class="panel__head">
        <h2 id="trigger-heading" class="panel__title">Submit</h2>
        <p class="panel__hint" id="trigger-hint"></p>
      </div>

      <div class="panel__body">
        <label class="field" id="sample-field">
          <span class="field__label">Load a sample</span>
          <select id="sample-picker" class="input">
            <option value="">— write your own —</option>
          </select>
        </label>

        <form id="trigger-form" class="form" autocomplete="off"></form>

        <button type="button" id="submit-btn" class="btn btn--primary">
          <span id="submit-label">Send</span>
        </button>

        <div id="submit-result" class="result" hidden></div>
      </div>
    </section>

    <!-- ---------------------------------------------------------------- -->
    <section class="panel panel--results" aria-labelledby="results-heading">
      <div class="panel__head panel__head--row">
        <div>
          <h2 id="results-heading" class="panel__title">Recent activity</h2>
          <p class="panel__hint" id="results-hint">—</p>
        </div>
        <button type="button" id="refresh-btn" class="btn btn--ghost">Refresh</button>
      </div>

      <div class="panel__body panel__body--flush">
        <div class="tablewrap">
          <table class="grid" id="results-table">
            <thead id="results-head"></thead>
            <tbody id="results-body"></tbody>
          </table>
        </div>
        <p class="empty" id="results-empty" hidden></p>
      </div>
    </section>

  </main>

  <footer class="foot">
    Local demo console for the Havelock automations.
    Havelock is a fictional company; all data shown is synthetic.
  </footer>

  <script src="app.js"></script>
</body>
</html>
